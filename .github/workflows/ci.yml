name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, Migrate & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: vitrine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap Database Roles (PostgreSQL 16)
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -p 5432 -U postgres -d vitrine_test -f db/bootstrap/0000_bootstrap_roles.sql

      - name: Run Database Migrations
        env:
          PGPASSWORD: postgrespassword
        run: |
          for migration in $(ls db/migrations/*.sql | sort); do
            echo "Applying $migration..."
            psql -h localhost -p 5432 -U postgres -d vitrine_test -f "$migration"
          done

      - name: Typecheck and Lint
        run: npm run lint

      - name: Run Test Suites
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://vitrine_app:change_me@localhost:5432/vitrine_test
        run: npm test
