name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  db-tests:
    name: DB Foundation & RLS Behavioral Tests (Job A)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Ephemeral trust auth for CI only; production must never use trust for vitrine_* roles.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vt_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vt_db_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate ephemeral migrator password
        run: |
          MIGRATOR_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$MIGRATOR_PASSWORD"
          echo "MIGRATOR_PASSWORD=$MIGRATOR_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify bootstrap SQL secret hygiene (dummy password check)
        run: |
          set -euo pipefail
          DUMMY_PW="vitrine_dummy_secret_check_987654"
          psql -h localhost -p 5432 -U postgres -d vt_db_test \
            -v ON_ERROR_STOP=1 \
            -v migrator_role="migrator" \
            -v migrator_password="$DUMMY_PW" \
            -f db/bootstrap/0000_bootstrap_migrator.sql > /tmp/bootstrap_hygiene.log 2>&1
          if grep -Fq "$DUMMY_PW" /tmp/bootstrap_hygiene.log; then
            echo "ERROR: Bootstrap SQL printed secret material to stdout/stderr!"
            rm -f /tmp/bootstrap_hygiene.log
            exit 1
          fi
          rm -f /tmp/bootstrap_hygiene.log
          echo "Bootstrap secret hygiene check passed."

      - name: Bootstrap migrator role (PostgreSQL 16)
        run: |
          psql -h localhost -p 5432 -U postgres -d vt_db_test \
            -v ON_ERROR_STOP=1 \
            -v migrator_role="migrator" \
            -v migrator_password="$MIGRATOR_PASSWORD" \
            -f db/bootstrap/0000_bootstrap_migrator.sql

      - name: Verify Migration Ordering & Naming
        run: |
          python3 -c '
          import os, re
          files = sorted(f for f in os.listdir("db/migrations") if f.endswith(".sql"))
          assert files, "No SQL migration files found in db/migrations"
          prev = 0
          for f in files:
              m = re.match(r"^(\d{4})_[A-Za-z0-9_]+\.sql$", f)
              assert m, f"Invalid migration filename format: {f}"
              num = int(m.group(1))
              assert num > prev, f"Out-of-order or duplicate migration prefix in: {f}"
              prev = num
          print("Migration order verified:", ", ".join(files))
          '

      - name: Apply Migrations as migrator
        run: |
          for migration in $(ls db/migrations/*.sql | sort); do
            echo "Applying $migration..."
            psql -h localhost -p 5432 -U migrator -d vt_db_test \
              -v ON_ERROR_STOP=1 \
              -f "$migration"
          done

      - name: Run test_v7.py behavioral suite (without operator script)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: vt_db_test
        run: |
          set -euo pipefail
          python3 db/tests/test_v7.py | tee test_v7.log
          grep -Fq "0 failed" test_v7.log

  app-tests:
    name: App Build, Secret Scan, Integration Tests & Smoke Test (Job B)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Ephemeral trust auth for CI only; production must never use trust for vitrine_* roles.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vitrine_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d vitrine_app_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies cleanly from lockfile
        run: npm ci

      - name: Generate ephemeral CI database credentials & tenant secret
        run: |
          MIGRATOR_PASSWORD="$(openssl rand -hex 24)"
          APP_PASSWORD="$(openssl rand -hex 24)"
          PUBLIC_PASSWORD="$(openssl rand -hex 24)"
          ADMIN_PASSWORD="$(openssl rand -hex 24)"
          REGISTRATION_PASSWORD="$(openssl rand -hex 24)"
          TENANT_CONTEXT_SECRET="$(openssl rand -hex 32)"
          for secret in "$MIGRATOR_PASSWORD" "$APP_PASSWORD" "$PUBLIC_PASSWORD" "$ADMIN_PASSWORD" "$REGISTRATION_PASSWORD" "$TENANT_CONTEXT_SECRET"; do
            echo "::add-mask::$secret"
          done
          {
            echo "MIGRATOR_PASSWORD=$MIGRATOR_PASSWORD"
            echo "APP_PASSWORD=$APP_PASSWORD"
            echo "PUBLIC_PASSWORD=$PUBLIC_PASSWORD"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "REGISTRATION_PASSWORD=$REGISTRATION_PASSWORD"
            echo "TENANT_CONTEXT_SECRET=$TENANT_CONTEXT_SECRET"
            echo "DATABASE_URL=postgresql://vitrine_app:${APP_PASSWORD}@localhost:5432/vitrine_app_test"
            echo "DATABASE_MIGRATOR_URL=postgresql://migrator:${MIGRATOR_PASSWORD}@localhost:5432/vitrine_app_test"
          } >> "$GITHUB_ENV"

      - name: Verify No Forbidden Cluster-Global Config Outside docs/
        run: |
          set -euo pipefail
          FORBIDDEN_PATTERN="ALTER""[[:space:]]+SYSTEM|pg_reload""_conf"
          if grep -rniE "$FORBIDDEN_PATTERN" . \
            --exclude-dir=docs \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.git; then
            echo "ERROR: Prohibited cluster-global PostgreSQL statements found outside docs/!"
            exit 1
          fi
          echo "Verified zero cluster-global PostgreSQL statements outside docs/."

      - name: Bootstrap migrator role (PostgreSQL 16)
        run: |
          psql -h localhost -p 5432 -U postgres -d vitrine_app_test \
            -v ON_ERROR_STOP=1 \
            -v migrator_role="migrator" \
            -v migrator_password="$MIGRATOR_PASSWORD" \
            -f db/bootstrap/0000_bootstrap_migrator.sql

      - name: Verify Migration Ordering & Naming
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("db/migrations").filter((f) => f.endsWith(".sql")).sort();
            if (files.length === 0) {
              throw new Error("No SQL migration files found in db/migrations");
            }
            let prev = 0;
            for (const file of files) {
              const match = /^(\d{4})_[A-Za-z0-9_]+\.sql$/.exec(file);
              if (!match) {
                throw new Error(`Invalid migration filename format: ${file}`);
              }
              const num = Number(match[1]);
              if (num <= prev) {
                throw new Error(`Out-of-order or duplicate migration prefix in: ${file}`);
              }
              prev = num;
            }
            console.log("Migration order verified:", files.join(", "));
          '

      - name: Apply Migrations via Runner (DB 1 — First Run + No-Op Re-Run)
        run: |
          set -euo pipefail
          npm run db:migrate
          SECOND_OUT="$(npm run db:migrate)"
          echo "$SECOND_OUT"
          echo "$SECOND_OUT" | grep -Fq "No pending migrations"

      - name: Verify Deployment Role & Membership Checks (DB 1)
        run: npm run db:check

      - name: Tamper Test (Modified Applied Migration Must Fail)
        run: |
          set -euo pipefail
          rm -rf /tmp/tampered_migrations
          cp -r db/migrations /tmp/tampered_migrations
          printf "\n-- tampered\n" >> /tmp/tampered_migrations/0001_DB_v7.sql
          if MIGRATIONS_DIR=/tmp/tampered_migrations npm run db:migrate > /tmp/tamper.log 2>&1; then
            echo "ERROR: Runner unexpectedly succeeded on tampered migration!"
            cat /tmp/tamper.log
            rm -rf /tmp/tampered_migrations /tmp/tamper.log
            exit 1
          fi
          cat /tmp/tamper.log
          grep -Fq "Checksum mismatch" /tmp/tamper.log
          rm -rf /tmp/tampered_migrations /tmp/tamper.log
          echo "Tamper check passed: modified applied migration was rejected."

      - name: Verify Clean Bootstrap & Idempotent Runner on Second Empty Database (DB 2)
        run: |
          set -euo pipefail
          psql -h localhost -p 5432 -U postgres -d vitrine_app_test \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE vitrine_second_test;"
          psql -h localhost -p 5432 -U postgres -d vitrine_second_test \
            -v ON_ERROR_STOP=1 \
            -v migrator_role="migrator" \
            -v migrator_password="$MIGRATOR_PASSWORD" \
            -f db/bootstrap/0000_bootstrap_migrator.sql
          SECOND_DB_URL="postgresql://migrator:${MIGRATOR_PASSWORD}@localhost:5432/vitrine_second_test"
          DATABASE_MIGRATOR_URL="$SECOND_DB_URL" npm run db:migrate
          SECOND_RUN_OUT="$(DATABASE_MIGRATOR_URL="$SECOND_DB_URL" npm run db:migrate)"
          echo "$SECOND_RUN_OUT"
          echo "$SECOND_RUN_OUT" | grep -Fq "No pending migrations"
          DATABASE_MIGRATOR_URL="$SECOND_DB_URL" npm run db:check

      - name: Run Operator Post-Migration Provisioning
        run: |
          set -euo pipefail
          psql -h localhost -p 5432 -U migrator -d vitrine_app_test \
            -v ON_ERROR_STOP=1 \
            -v app_password="$APP_PASSWORD" \
            -v public_password="$PUBLIC_PASSWORD" \
            -v admin_password="$ADMIN_PASSWORD" \
            -v registration_password="$REGISTRATION_PASSWORD" \
            -v tenant_secret_hex="$TENANT_CONTEXT_SECRET" \
            -f db/operator/0001_post_migration.sql > /tmp/operator_hygiene.log 2>&1
          for secret in "$APP_PASSWORD" "$PUBLIC_PASSWORD" "$ADMIN_PASSWORD" "$REGISTRATION_PASSWORD" "$TENANT_CONTEXT_SECRET"; do
            if grep -Fq "$secret" /tmp/operator_hygiene.log; then
              echo "ERROR: Operator SQL printed secret material to stdout/stderr!"
              rm -f /tmp/operator_hygiene.log
              exit 1
            fi
          done
          rm -f /tmp/operator_hygiene.log
          echo "Operator post-migration provisioning and secret hygiene check passed."

      - name: Typecheck
        run: npm run typecheck

      - name: Build Client & Server Bundles
        run: npm run build

      - name: Verify No Internal or Forbidden Files in dist/
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const forbiddenExtensions = [".sql", ".md", ".py", ".env", ".log"];
            const offending = [];
            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  if (entry.name === "aistudio") {
                    offending.push(full + "/");
                  }
                  walk(full);
                } else if (entry.isFile()) {
                  const lower = entry.name.toLowerCase();
                  if (forbiddenExtensions.some((ext) => lower.endsWith(ext))) {
                    offending.push(full);
                  }
                }
              }
            }
            walk("dist");
            if (offending.length > 0) {
              console.error("Forbidden files or folders found in dist/:\n" + offending.join("\n"));
              process.exit(1);
            }
            console.log("Verified dist/ contains no forbidden internal files or aistudio directories.");
          '

      - name: Verify Client Bundle Contains No Secrets or .env.example Values
        run: node scripts/scan-dist.mjs

      - name: Run Test Suites as vitrine_app
        env:
          CI: 'true'
          NODE_ENV: test
        run: npm test

      - name: Production Smoke Test (dist/server.js)
        env:
          NODE_ENV: production
          PORT: '3000'
        run: |
          set -euo pipefail
          npm start &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3000/health/live; then
              echo ""
              ROOT_STATUS=$(curl -sS -o /tmp/smoke_root.html -D /tmp/smoke_headers.txt -w "%{http_code}" http://127.0.0.1:3000/)
              echo "GET / returned HTTP $ROOT_STATUS"
              test "$ROOT_STATUS" = "200"
              grep -qi "^content-type: text/html" /tmp/smoke_headers.txt
              grep -qi "<div id=\"root\">" /tmp/smoke_root.html
              for check_path in "/assets/aistudio/x" "/db/migrations/0001_DB_v7.sql"; do
                curl -sS -o /tmp/smoke_probe.txt "http://127.0.0.1:3000${check_path}"
                if grep -Fq "vitrine_core" /tmp/smoke_probe.txt || grep -Fq "CREATE SCHEMA" /tmp/smoke_probe.txt; then
                  echo "ERROR: ${check_path} returned internal SQL content!"
                  exit 1
                fi
              done
              rm -f /tmp/smoke_root.html /tmp/smoke_headers.txt /tmp/smoke_probe.txt
              echo "Production smoke test passed."
              exit 0
            fi
            sleep 1
          done
          echo "Production smoke test failed: /health/live did not become reachable."
          exit 1
